name: Validate and package RIFTBOUND

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate JSON files
        run: |
          find Riftbound_BP Riftbound_RP -name '*.json' -print0 | while IFS= read -r -d '' file; do
            python -m json.tool "$file" >/dev/null
            echo "OK: $file"
          done
      - name: Check pack linkage, custom entities, and locales
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          bp=json.load(open('Riftbound_BP/manifest.json'))
          rp=json.load(open('Riftbound_RP/manifest.json'))
          dep=bp.get('dependencies', [])
          assert any(x.get('uuid') == rp['header']['uuid'] and x.get('version') == rp['header']['version'] for x in dep), 'Behavior pack dependency does not match resource pack'
          assert bp['header']['uuid'] != bp['modules'][0]['uuid']
          assert rp['header']['uuid'] != rp['modules'][0]['uuid']
          scripts=[m for m in bp['modules'] if m.get('type') == 'script']
          assert len(scripts) == 1, 'Expected exactly one script module'
          assert Path('Riftbound_BP', scripts[0]['entry']).is_file(), 'Script entry file is missing'
          assert any(x.get('module_name') == '@minecraft/server' and x.get('version') == '2.6.0' for x in dep), 'Stable Script API dependency is missing'
          locales=json.load(open('Riftbound_RP/texts/languages.json'))
          for locale in locales:
              assert Path(f'Riftbound_RP/texts/{locale}.lang').is_file(), f'Missing locale file: {locale}'
          for entity_file in Path('Riftbound_BP/entities').glob('*.json'):
              identifier=json.load(open(entity_file))['minecraft:entity']['description']['identifier']
              client_file=Path('Riftbound_RP/entity') / (entity_file.stem + '.entity.json')
              assert client_file.is_file(), f'Missing client entity for {identifier}'
              client_id=json.load(open(client_file))['minecraft:client_entity']['description']['identifier']
              assert identifier == client_id, f'Client/behavior identifier mismatch: {identifier} vs {client_id}'
              spawn_file=Path('Riftbound_BP/spawn_rules') / entity_file.name
              assert spawn_file.is_file(), f'Missing spawn rules for {identifier}'
          expected = {'ironback','glassfang','skitter','colossus','hollowmaw','gloommite','thornprowler'}
          actual = {p.stem for p in Path('Riftbound_BP/entities').glob('*.json')}
          assert expected <= actual, f'Missing creature definitions: {expected-actual}'
          for rule_file in Path('Riftbound_BP/spawn_rules').glob('*.json'):
              rule=json.load(open(rule_file))['minecraft:spawn_rules']
              assert rule['conditions'], f'No spawn conditions: {rule_file}'
              for condition in rule['conditions']:
                  assert 'minecraft:herd' in condition and 'minecraft:weight' in condition, f'Missing herd/weight: {rule_file}'
          entities = {p.stem: json.load(open(p))['minecraft:entity']['components'] for p in Path('Riftbound_BP/entities').glob('*.json')}
          for mob in ('skitter','gloommite'):
              assert entities[mob].get('minecraft:behavior.hurt_by_target',{}).get('alert_same_type') is True, f'{mob} must alert its pack'
          for mob in ('glassfang','thornprowler','skitter'):
              assert 'minecraft:behavior.leap_at_target' in entities[mob], f'{mob} is missing its leap behavior'
          for mob in ('ironback','hollowmaw'):
              assert 'minecraft:behavior.hurt_by_target' in entities[mob], f'{mob} is missing retaliation behavior'
          expected_items = {'emberguard_helmet','emberguard_chestplate','emberguard_leggings','emberguard_boots','riftbreaker'}
          item_files = {p.stem for p in Path('Riftbound_BP/items').glob('*.json')}
          assert expected_items <= item_files, f'Missing progression gear: {expected_items-item_files}'
          for item_name in expected_items:
              item = json.load(open(Path('Riftbound_BP/items') / f'{item_name}.json'))['minecraft:item']
              assert item['description']['identifier'] == f'riftbound:{item_name}'
              assert 'minecraft:icon' in item['components']
              recipe = Path('Riftbound_BP/recipes') / f'{item_name}.json'
              assert recipe.is_file(), f'Missing recipe for {item_name}'
              assert json.load(open(recipe))['minecraft:recipe_shaped']['result']['item'] == f'riftbound:{item_name}'
          armor_slots = {'emberguard_helmet':'slot.armor.head','emberguard_chestplate':'slot.armor.chest','emberguard_leggings':'slot.armor.legs','emberguard_boots':'slot.armor.feet'}
          for item_name, slot in armor_slots.items():
              comp = json.load(open(Path('Riftbound_BP/items') / f'{item_name}.json'))['minecraft:item']['components']
              assert comp['minecraft:wearable']['slot'] == slot and comp['minecraft:wearable']['protection'] > 0
              assert comp['minecraft:durability']['max_durability'] > 0
          assert 'riftbound:riftbreaker' in json.load(open('Riftbound_RP/textures/item_texture.json'))['texture_data']
          print('Pack linkage, seven creature pairs, spawn ecology, encounter AI, progression gear, recipes, API dependency, and locales OK')
          PY
      - name: Check JavaScript syntax
        run: node --input-type=module --check < Riftbound_BP/scripts/main.js
      - name: Package add-on
        run: |
          mkdir -p dist
          zip -qr dist/RIFTBOUND.mcaddon Riftbound_BP Riftbound_RP
          zip -qr dist/RIFTBOUND-Source.zip Riftbound_BP Riftbound_RP docs README.md
      - uses: actions/upload-artifact@v4
        with:
          name: RIFTBOUND-build
          path: dist/*
          if-no-files-found: error
